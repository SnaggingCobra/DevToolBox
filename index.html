<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevTolBox</title>
    
    <link rel="stylesheet" href="style.css" /> 

    <link rel="preload" href="tools/json-formatter/json-formatter.css" as="style">
    <link rel="preload" href="tools/json-validator/json-validator.css" as="style">
    <link rel="preload" href="tools/regex-tester/regex-tester.css" as="style">
    <link rel="preload" href="tools/diff-checker/diff-checker.css" as="style">

    <link rel="preload" href="tools/color-converter/color-converter.css" as="style">
    <link rel="preload" href="tools/gradient-generator/gradient-generator.css" as="style">
    <link rel="preload" href="tools/box-shadow/box-shadow.css" as="style">
    <link rel="preload" href="tools/flexbox-generator/flexbox-generator.css" as="style">

    <link rel="preload" href="tools/base64/base64.css" as="style">
    <link rel="preload" href="tools/url-encoder/url-encoder.css" as="style">
    <link rel="preload" href="tools/jwt-decoder/jwt-decoder.css" as="style">


  </head>
  <body>

          <header class="topbar">

              <div class="brand">
                  <span class="brand-icon">
                    <img src="assets/Logo.jpg" alt="Settings">
                  </span>
                  <h1>DevToolBox</h1>
              </div>

              <div class="topbar-actions">
                  <button class="header-button" id="themeButton" title="Toggle theme" aria-label="Toggle theme">
                      <img src="assets/mode.png" alt="Toggle theme">
                  </button>
              </div>

            </header>

    <main class="container">
      <aside class="toolbar">
            <div class="toolbar-header">
                <h2>🧰 ToolBar</h2>
            </div>
               
              <div class="search-box" >
                  <input type="search" id="toolSearch" placeholder="🔍 Search tools..." aria-label="Search tools">
              </div>

              <p class="search-empty" id="searchEmpty" hidden>No tools found.</p>

        <nav class="tool-navigation">
              <div class="tool-category">
                <h3>💻 Code</h3>

                <button id="jsonFormatterTool" >JSON Formatter</button>
                <button id="ValidatorTool" >JSON Validator</button>
                <button id="RegexTesterTool">Regex Tester</button>
                <button id="DiffCheakerTool">Diff Checker</button>
              </div>

              <div class="tool-category">
                <h3>🎨 CSS</h3>

                <button id="ColorConverterTool">Color Converter</button>
                <button id="GradientGeneratorTool">Gradient Generator</button>
                <button id="BoxShadowTool">Box Shadow</button>
                <button id="FlexboxGeneratorTool">Flexbox Generator</button>


                <h3>🔐 Encoding</h3>

                <button id="Base64Tool">Base64</button>
                <button id="urlEncoderTool">URL Encoder</button>
                <button id="jwtDecoderTool">JWT Decoder</button>


                <!-- <h3>⚙️ Generacheck tors</h3>

                <button>UUID Generator</button>
                <button>Password Generator</button>
                <button>QR Code Generator</button> -->

              </div>
        </nav>
      </aside>
    <section class="workspace" id="Workspace">

      <div class="welcome-screen">

          <div class="welcome-icon">
              🧰
          </div>

          <h2>DevToolBox</h2>

          <p>
              Developer tools, all in one place.
          </p>

          <span>
              Select a tool from the sidebar to get started.
          </span>

      </div>

    </section>
      
    
      
    </main>

    <script src="script.js"></script>
  </body>
</html>
