<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevToolBox is a collection of small developer tools for coding and web development.">
    <title>DevSatchel</title>
    
    <link rel="stylesheet" href="style.css" /> 

  </head>
  <body>

          <header class="topbar">

            
              <div class="brand">
                  <span class="brand-icon">
                    <img src="assets/Logo.jpg" alt="Settings">
                  </span>
                  <h1>DevSatchel</h1>
              </div>

              <div class="topbar-actions">
                  <button class="header-button" id="themeButton" title="Toggle theme" aria-label="Toggle theme">
                      <img src="assets/mode.png" alt="Toggle theme">
                  </button>
              </div>

            </header>

    <main class="container">
      <aside class="toolbar">
            <div class="toolbar-header">
                <h2>ToolBar</h2>
            </div>
               
              <div class="search-box" >
                  <input type="search" id="toolSearch" placeholder="🔍 Search tools..." aria-label="Search tools">
              </div>

              <p class="search-empty" id="searchEmpty" hidden>No tools found.</p>

        <nav class="tool-navigation">

              

              <div class="tool-category">
                <h3> Code</h3>

                <button class="tool-button" id="jsonFormatterTool">
                  <span>JSON Formatter<small>Format and beautify JSON</small></span>
                </button>
                <button class="tool-button" id="ValidatorTool">
                  <span>JSON Validator<small>Check JSON for errors</small></span>
                </button>
                <button class="tool-button" id="RegexTesterTool">
                  <span>Regex Tester<small>Test regular expressions</small></span>
                </button>
                <button class="tool-button" id="DiffCheckerTool">
                  <span>Diff Checker<small>Compare text changes</small></span>
                </button>
                <button class="tool-button" id="HTTPRequestBuilderTool">
                  <span>HTTP Request Builder<small>Build and send API requests</small></span>
                </button>
                <button class= "tool-button" id="CodeBeautifierTool">
                  <span>Code Beautifier<small>give your code a hint of beauty</small></span>
                </button>
              </div>

              <div class="tool-category">
                <h3> CSS</h3>

                <button class="tool-button" id="ColorConverterTool">
                  <span>Color Converter<small>Convert color formats</small></span>
                </button>
                <button class="tool-button" id="CSSUnitConverterTool">
                  <span>CSS Unit Converter<small>Convert CSS measurements</small></span>
                </button>
                <button class="tool-button" id="GradientGeneratorTool">
                  <span>Gradient Generator<small>Create CSS gradients</small></span>
                </button>
                <button class="tool-button" id="FlexboxGeneratorTool">
                  <span>Flexbox Generator<small>Build Flexbox layouts</small></span>
                </button>
                 <button class="tool-button" id="BoxShadowTool">
                  <span>Box Shadow<small>Generate CSS box shadows</small></span>
                </button>
                <button class="tool-button" id="ColorPaletteTool">
                  <span>Color Palette<small>Generate color palettes</small></span>
                </button>
                


                <h3> Encoding</h3>

                <button class="tool-button" id="Base64Tool">
                  <span>Base64<small>Encode and decode Base64</small></span>
                </button>
                <button class="tool-button" id="urlEncoderTool">
                  <span>URL Encoder<small>Encode and decode URLs</small></span>
                </button>
                <button class="tool-button" id="jwtDecoderTool">
                  <span>JWT Decoder<small>Decode JWT token contents</small></span>
                </button>
                <button class="tool-button" id="HashGeneratorTool"> 
                  <span>Hash Generator<small>Generate secure hashes</small></span>
                </button>
                <button class="tool-button" id="AESEncryptionTool">
                  <span>AES Encryption<small>Encrypt and decrypt with AES</small></span>
                </button>

                <h3>Generators</h3>

                <button class="tool-button" id="UUIDGeneratorTool">
                  <span>UUID Generator<small>Create unique identifiers</small></span>
                </button>
                <button class="tool-button" id="PasswordGeneratorTool">
                  <span>Password Generator<small>Create strong passwords</small></span>
                </button>
                <button class="tool-button" id="QRCodeGeneratorTool">
                  <span>QR Code Generator<small>Make QR codes</small></span>
                </button>
                <button class="tool-button" id="BarcodeGeneratorTool">
                  <span>Barcode Generator<small>Make barcodes</small></span>
                </button>
                

                <h3> Others</h3>

                  <button class="tool-button" id="imageCompressor">
                    <span>Image Compressor<small>Compress your image </small></span>
                  </button>
                  <button class="tool-button" id="imageResizer">
                    <span>Image Resizer<small>Resize your image</small></span>
                  </button>


                <h3> AI TOOLS</h3>

                  <button class="tool-button" id="AiCodeReviewerTool">
                    <span>AI Code Reviewer<small>Review code with AI</small></span>
                  </button>
 
              </div>
        </nav>
      </aside>
    <div class="content-column">
      <section class="workspace" id="Workspace">

      <div class="welcome-screen">

          <div class="welcome-icon">
              
          </div>

          <h2>DevSatchel</h2>

          <p>
              Developer tools, all in one place.
                    DevTools in one web
          </p>

          <span>
              Select a tool from the sidebar to get started.
         </span>
 
          <button class="quick-links-button" id="quickLinksButton" type="button">
              Quick Links
          </button>
          


      </div>

      </section>

      <section class="dev-joke-card" aria-labelledby="devJokeTitle">
        <div class="dev-joke-header">
          <div>
            <h2 id="devJokeTitle">Dev Joke</h2>
            <p>A random joke for devs before getting back to that headache.</p>

            <button id="refreshJoke" class="refresh-joke-btn" type="button">
              New Joke
            </button>

          </div>
          <div id="devJoke" class="dev-joke-content" aria-live="polite">
            <p>Loading joke...</p>
          </div>

        </div>
      </section>
    </div>
      
    
    </main>

    <script src="script.js?v=20260922-2"></script>
  </body>
</html>
