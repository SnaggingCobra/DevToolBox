<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevTolBox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

          <header class="topbar">

              <div class="brand">
                  <span class="brand-icon">
                    <img src="assets/Logo.jpg" alt="Settings">
                  </span>
                  <h1>DevToolBox</h1>
              </div>

              <div class="topbar-actions">

                  <button class="header-button" title="Toggle theme">
                      <img src="assets/mode.png" alt="Settings">
                  </button>

                  <button class="header-button" title="Settings">
                      <img src="assets/setting.png" alt="Settings">
                  </button>
              </div>

            </header>

    <main class="container">
      <aside class="toolbar">
            <div class="toolbar-header">
                <h2>🧰 ToolBar</h2>
            </div>
               
              <div class="search-box">
                  <input type="text" placeholder="🔍 Search tools...">
              </div>

              <div class="quick-links">

                <button>⭐ Favorite</button>
                <button>🕐 Recent</button>

              </div>


        <nav class="tool-navigation">
              <div class="tool-category">
                <h3>💻 Code</h3>

                <button>JSON Formatter</button>
                <button>JSON Validator</button>
                <button>Regex Tester</button>
                <button>Diff Checker</button>



                <h3>🎨 CSS</h3>

                <button>Color Converter</button>
                <button>Gradient Generator</button>
                <button>Box Shadow</button>
                <button>Flexbox Generator</button>


                <h3>🔐 Encoding</h3>

                <button>Base64</button>
                <button>URL Encoder</button>
                <button>JWT Decoder</button>


                <h3>⚙️ Generators</h3>

                <button>UUID Generator</button>
                <button>Password Generator</button>
                <button>QR Code Generator</button>

              </div>
        </nav>
      </aside>
    <section class="workspace">

      <div class="welcome-screen">

          <div class="welcome-icon">
              🧰
          </div>

          <h2>DevToolBox</h2>

          <p>
              Developer tools, all in one place.
          </p>

          <span>
              Select a tool from the sidebar to get started.
          </span>

      </div>

    </section>
      
    
      
    </main>

    <script src="script.js"></script>
  </body>
</html>
