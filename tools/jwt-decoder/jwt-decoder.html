<div class="jwt-tool">
    <div class="tool-header">
        <h2>JWT Decoder</h2>
        <p>Decode a json Web Token (JWT) </p>
    </div>

    <div class="jwt-section">
        <label for="jwtInput">JWT Token</label>
        <textarea  id="jwtInput" placeholder="Paste your JWT token "></textarea>
    </div>
    
    <div class="jwt-actions">

        <button id="decodeJWT">Decode JWT</button>

        <button id="clearJwt">Clear</button>

    </div>

    <div class="jwt-section">
        <div class="jwt-header-row">
            <label for="jwtHeader">Header</label>
            <button id="copyJwtHeader" type="button" class="btn-copy">Copy</button>
        </div>
        <textarea id="jwtHeader" readonly placeholder="Decoded header will appear here..."></textarea>
    </div>

    <div class="jwt-section">
        <div class="jwt-header-row">
            <label for="jwtPayload">Payload</label>
            <button id="copyJwtPayload" type="button" class="btn-copy">Copy</button>
        </div>
        <textarea id="jwtPayload" readonly placeholder="Decoded payload will appear here..."></textarea>
    </div>

    <div id="jwtStatus" class="jwt-status">
        Ready

    </div>
</div>
