<div class="ai-code-reviewer">
    <div class="reviewer-header">
        <h2>AI Code Reviewer</h2>
        <p>Analyze your code for bugs, security issues, performance, and quality.</p>
    </div>

    <div class="reviewer-controls">
        <div class="control-group">
            <label for="codeLanguage">Language</label>
            <select  id="codeLanguage">
                <option value="javascript">Javascript</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="c">C</option>
                <option value="csharp">C#</option>
                <option value="php">PHP</option>
                <option value="html">HTML</option>
                <option value="typescript">TypeScript</option>
                <option value="sql">SQL</option>
                <option value="other">Others</option>

            </select>
        </div>

        <div class="control-group">
            <label for="reviewType">Review Type</label>
            <select  id="reviewType">
                <option value="full">Full Review</option>
                <option value="bugs">Find Bugs</option>
                <option value="security">Security</option>
                <option value="performance">Performance</option>
                <option value="quality">Quality</option>
                <option value="readability">Readability</option>
                <option value="tests">Generate Tests</option>
            </select>
        </div>
    </div>

    <div class="code-input-section">
        <div class="section-header">
            <label for="codeInput">Your Code</label>
            <button id="clearCode" type="button">Clear</button>


        </div>

        <textarea id="codeInput" spellcheck="false" placeholder="Paste your code"></textarea>
    </div>


    <div class="description-section">
        <label for="codeDescription">What this code Does</label>

        <textarea  id="codeDescription" rows="3" placeholder="Example: this function should validate "></textarea>
    </div>

    <button id="reviewCode" class="review-button" type="button">Review</button>

    <div class="review-output">
        <div class="output-header">
            <h3>Review Results</h3>
            <span id="reviewStatus">Ready</span>
        </div>
        <div class="review-results" id="reviewResults">
        <div class="empty-review">
            <div class="empty-icon">
                AI
            </div>
            <h3>Review Required</h3>

        </div>
    </div>

    </div>

</div>
