<div class="diff-tool">
    <div class="tool-header">
        <h2>Diff Checker</h2>
        <p>Compare two pieces of text and find the differences.</p>
    </div>


    <div class="diff-editor">
        <div class="diff-panel">
            <div class="diff-panel-header">
            <span>Original Text</span>
            </div>
        </div>
    <textarea id="originalText" placeholder="Enter The Real Text..."></textarea>
    </div>

    <div class="diff-panel">
        <div class="diff-panel-header">
            <span>Changes Text</span>
        </div>
        <textarea id="changedText" placeholder="Enter the Changed text...">  </textarea>
    </div>

</div>

<div class="diff-actions">
    <button id="compareText">
        Compare
    </button>
    <button id="clearDiff">
        Clear
    </button>
</div>

<div class="diff-results">
    <div class="diff-result-header">
        Result
    </div>
    <div id="diffResult">
        Enter Two TeXT and compare

    </div>

</div>
