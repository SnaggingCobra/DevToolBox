<div class="base64-tool">
    <div class="tool-header">
        <h2>Base64 Encoder/Decoder</h2>
        <p>Encode text to base 64 or decode base64 to text</p>

    </div>

    <div class="base64-section">
        <label for="base64Input">Input</label>
        <textarea  id="base64Input" placeholder="Enter Text or Base64......"></textarea>

    </div>

    <div class="base64-actions">
        <button id="encodeBase64">Encode</button>
        <button id="decodeBase64">Decode</button>
        <button id="clearBase64">Clear</button>

    </div>

    <div class="base64-section">
        <div class="output-label">
            <label for="base64Output">Output</label>
            <button id="copyBase64"> Copy</button>

        </div>
        <textarea  id="base64Output" placeholder="Result Here" readonly></textarea>
    </div>
    <div id="base64Status" class="base64-status">
        Ready
    </div>
</div>
