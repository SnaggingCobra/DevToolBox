<div class="password-generator">
    <div class="tool-header">
        <h2>Password Generator</h2>
        <p>Generate a strong, cryptographically secure random password.</p>
    </div>

    <div class="password-output">
        <input type="text" id="passwordOutput" readonly placeholder="Your password will appear here...">
        <button id="generatePassword" type="button" class="btn-primary">Generate Password</button>
        <button id="copyPassword" type="button" class="btn-secondary">Copy Password</button>
    </div>

    <div class="password-options">
        <div class="password-field-group">
            <label for="passwordLength">Password Length</label>
            <input type="number" id="passwordLength" min="4" max="128" value="12">
        </div>

        <label class="password-checkbox-label">
            <input type="checkbox" id="includeUppercase" checked>
            Uppercase Letters (A-Z)
        </label>

        <label class="password-checkbox-label">
            <input type="checkbox" id="includeLowercase" checked>
            Lowercase Letters (a-z)
        </label>

        <label class="password-checkbox-label">
            <input type="checkbox" id="includeNumbers" checked>
            Include Numbers (0-9)
        </label>

        <label class="password-checkbox-label">
            <input type="checkbox" id="includeSymbols" checked>
            Include Symbols (!@#$%^&*...)
        </label>
    </div>

    <div id="passwordStatus" class="password-status">Ready</div>
</div>
