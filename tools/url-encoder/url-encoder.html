<div class="url-encoder-tool">
    <div class="tool-header">
        <h2>URL Encoder / Decoder</h2>
        <p>Encode special characters in URLs or decode Encoded URL </p>
    </div>

    <div class="url-selection">
        <label for="urlInput">Input</label>
        <textarea  id="urlInput" placeholder="Enter Your URL/Text....."></textarea>

    </div>

    <div class="url-actions">
        <button id="encodeUrl">Encode</button>
        <button id="decodeUrl">Decode</button>
        <button id="clearUrl">Clear</button>

    </div>

        <div class="url-section">
            <div class="url-output-label">
                <label for="urlOutput">Output</label>
                <button id="copyUrl">Copy</button>
            </div>

            <textarea  id="urlOutput" readonly placeholder="Reselt"></textarea>


        </div>

        <div id="urlStatus" class="url-status">
            Ready
        </div>

</div>
