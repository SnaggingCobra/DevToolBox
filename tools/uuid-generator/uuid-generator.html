<div class="uuid-generator">
    <div class="tool-header">
        <h2>UUID Generator</h2>
        <p>Generate cryptographically random UUIDs (version 4).</p>
    </div>

    <div class="uuid-output">
        <input type="text" id="uuidOutput" readonly placeholder="UUID will appear here...">
        <button id="generateUUIDButton" type="button">Generate UUID</button>
        <button id="copyUUIDButton" type="button">Copy UUID</button>
    </div>

    <div id="uuidStatus" class="uuid-status">Ready</div>
</div>
